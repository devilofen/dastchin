<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="دموی کشف و خرید مد مستقل ایرانی — نمونهٔ نمایشی، بدون فروش واقعی.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دست‌چین">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>دستچین — نسخهٔ ۰.۱</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="phone" id="phone">

  <div class="statusbar">
    <span>۹:۴۱</span>
    <span class="dots"><i></i><i></i><i></i></span>
  </div>

  <header class="topbar">
    <button class="icon-btn" id="startBtn" data-act="index" aria-label="منو"></button>
    <div class="wordmark">دست‌چین</div>
    <button class="icon-btn cart-shortcut" data-act="go" data-screen="cart" aria-label="سبد خرید">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      <span class="badge" id="cartBadge" hidden>۰</span>
    </button>
  </header>

  <main class="screen" id="screen"></main>

  <div id="dock"></div>

  <nav class="tabbar" id="tabbar"></nav>

  <div class="sheet" id="sheet" hidden></div>

</div>

<script src="app.js"></script>
<script src="pwa.js" defer></script>
</body>
</html>
